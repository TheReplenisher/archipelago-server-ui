[project]
name = "apsui"
version = "0.1.0.dev0"
description = "Web service for Archipelago Server UI: UI, API, auth, lifecycle and logs."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16",
    # Only for the protocols: apsui_worker.protocol (job files) and apsui_server.protocol
    # (control socket). Neither imports Archipelago.
    "apsui-server",
    "apsui-worker",
    "fastapi>=0.120",
    "pydantic-settings>=2.10",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.35",
]

[project.scripts]
apsui-web = "apsui.__main__:main"

[tool.uv.sources]
apsui-server = { path = "../server", editable = true }
apsui-worker = { path = "../worker", editable = true }

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "mypy>=1.17",
    "pytest>=8.4",
    "ruff>=0.13",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apsui"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
packages = ["apsui"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
