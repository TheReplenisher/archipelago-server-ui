# Dependency update PRs. Each one runs the full CI, which must pass before it can merge.
# Minor and patch updates are grouped into one PR per ecosystem; majors come one at a time.
# The cooldown skips releases younger than a week, so a compromised or broken release
# has time to be noticed and pulled before it is proposed here.
#
# Archipelago itself (ARG AP_VERSION in the Dockerfile) is pinned on purpose and is not
# updated here: AP upgrades are deliberate (DESIGN.md §1). The archipelago-releases
# workflow watches for new AP versions instead and opens an issue for each.
version: 2

updates:
  # The three Python packages (each has its own uv.lock)
  - package-ecosystem: uv
    directories: [/backend, /worker, /server]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Matches the Node runtime major; moves with it (see the docker entry below).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      frontend:
        update-types: [minor, patch]

  # node and the uv binary in the Dockerfile. The python images are written with
  # ${PYTHON_VERSION}, which Dependabot can't resolve, so they stay on 3.12 (AP's runtime)
  # and pick up 3.12.x patch releases whenever the image is rebuilt.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Node majors are a deliberate upgrade to the next even-numbered LTS, done together in
      # the Dockerfile, ci.yml (setup-node), frontend/package.json (engines, @types/node).
      # Without this, Dependabot proposes odd-numbered, non-LTS majors too.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        update-types: [minor, patch]

  # Keeps the SHA-pinned actions in .github/workflows current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]
