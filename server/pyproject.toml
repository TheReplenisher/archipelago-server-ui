[project]
name = "apsui-server"
version = "0.1.0.dev0"
description = "Server service for Archipelago Server UI: supervises MultiServer and serves the control socket."
license = "MIT"
requires-python = ">=3.12"
# Standard library only: this package is installed into Archipelago's own environment.
dependencies = []

# No console script, for the same reason as apsui-worker: the image provides
# /usr/local/bin/apsui-server.

[dependency-groups]
dev = [
    "mypy>=1.17",
    "pytest>=8.4",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apsui_server"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
packages = ["apsui_server"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
